# ==============================================================================
# Prettier Configuration (.prettierrc.yaml)
#
# Tool: Prettier (https://prettier.io/)
# Purpose: Opinionated code and data formatter.
# Why it's in Zenith: Enforces consistent 2-space indentation, 88-character line
# length, and clean formatting across all YAML manifests and CSS stylesheets.
# ==============================================================================

printWidth: 88
tabWidth: 2
useTabs: false
semi: true
singleQuote: false
bracketSpacing: true
proseWrap: "preserve"
