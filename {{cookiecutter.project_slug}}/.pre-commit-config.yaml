# ==============================================================================
# Pre-commit Configuration (.pre-commit-config.yaml)
#
# Tool: Pre-commit (https://pre-commit.com/)
# Purpose: Multi-language framework for managing and running git pre-commit hooks.
# Why it's in Zenith: Validates file integrity, detects secrets, formats TOML,
# and checks code formatting and typing prior to every git commit.
# ==============================================================================

---
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
        name: "🛠️ pre-commit · Check for case conflicts"
      - id: check-merge-conflict
        name: "🛠️ pre-commit · Check for merge conflicts"
      - id: check-yaml
        name: "🛠️ pre-commit · Check YAML files"
      - id: end-of-file-fixer
        name: "🛠️ pre-commit · Fix end of file"
      - id: mixed-line-ending
        name: "🛠️ pre-commit · Check mixed line endings"
      - id: trailing-whitespace
        name: "🛠️ pre-commit · Check trailing whitespace"
      - id: check-json
        name: "🛠️ pre-commit · Check JSON files"
      - id: check-added-large-files
        name: "🛠️ pre-commit · Check for large files"
        args: ["--maxkb=2000"]
      - id: check-xml
        name: "🛠️ pre-commit · Check XML files"
      - id: check-toml
        name: "🛠️ pre-commit · Check TOML files"
      - id: pretty-format-json
        name: "🛠️ pre-commit · Check and fix JSON files"
        args: ["--autofix", "--indent=4"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        name: "🐍 validate-pyproject · Validate pyproject.toml"
        additional_dependencies:
          - validate-pyproject-schema-store[all]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        name: "🐍 ruff · Check Python code"
        args: [--fix, --config, ./ruff.toml]
      - id: ruff-format
        name: "🐍 ruff · Format Python code"
        args: [--config, ./ruff.toml]
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.75
    hooks:
      - id: rumdl-fmt
        name: "📝 rumdl · Format Markdown files"
        types: [text]
        files: \.md$
        args: [--no-exclude]
        additional_dependencies:
          - ruff>=0.17.0
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: "⚙️ taplo · Format TOML files"
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        name: "🔤 typos · Check for typos"
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "🎨 prettier · Format YAML files"
        types: [yaml]
      - id: prettier
        name: "🎨 prettier · Format CSS files"
        alias: prettier-css
        types: [css]
  - repo: local
    hooks:
      - id: pyrefly
        name: "🐍 pyrefly · Type check Python code"
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        files: \.(py|pyi)$
      - id: complexipy
        name: "🧮 complexipy · Cognitive complexity check"
        entry: uv run complexipy src tests
        language: system
        pass_filenames: false
        files: \.(py|pyi)$
      - id: tach
        name: "📐 tach · Architecture boundaries check"
        entry: uv run tach check
        language: system
        pass_filenames: false
        files: (\.(py|pyi)$|^tach\.toml$)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock
        name: "🐍 uv · Lock dependencies"
